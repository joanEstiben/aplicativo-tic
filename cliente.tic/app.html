<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soporte TIC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }

  /* Partículas de fondo */
  .bg-orb{
    position:fixed;border-radius:50%;filter:blur(80px);opacity:0.15;pointer-events:none;
  }
  .orb1{width:400px;height:400px;background:#6366f1;top:-100px;left:-100px;}
  .orb2{width:300px;height:300px;background:#0ea5e9;bottom:-80px;right:-80px;}
  .orb3{width:200px;height:200px;background:#a855f7;top:40%;left:60%;}

  /* Header */
  header{
    width:100%;padding:10px 14px 8px;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    position:relative;z-index:10;
  }
  .header-left{display:flex;align-items:center;gap:10px;}
  
  /* Contenedor del Logo de la empresa */
  .header-logo-container{
    width:70px;height:70px;border-radius:14px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(99,102,241,0.3);
  }
  .app-logo{
    width:100%;height:100%;
    object-fit:contain;
  }

  .header-title{color:white;font-size:13px;font-weight:700;letter-spacing:-0.3px;}
  .header-sub{color:#94a3b8;font-size:9px;font-weight:400;margin-top:1px;}
  .header-badge{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;padding:4px 10px;
    color:#e2e8f0;font-size:10px;font-weight:500;
    display:flex;align-items:center;gap:5px;
  }
  .badge-dot{width:7px;height:7px;border-radius:50%;background:#10b981;
    box-shadow:0 0 8px #10b981;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  /* Main */
  main{
    flex:1;width:100%;max-width:420px;
    padding:8px 14px 10px;
    display:flex;flex-direction:column;gap:6px;
    position:relative;z-index:10;
  }

  .section-label{
    color:#94a3b8;font-size:9px;font-weight:600;
    letter-spacing:1.5px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,rgba(148,163,184,0.3),transparent);
  }

  .section-title{
    color:white;font-size:15px;font-weight:800;
    letter-spacing:-0.5px;margin-top:2px;
  }
  .section-title span{
    background:linear-gradient(90deg,#818cf8,#c084fc);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }

  /* Grid tarjetas */
  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
  }

  .card{
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.1);
    border-radius:14px;padding:10px 10px 8px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    position:relative;overflow:hidden;
    backdrop-filter:blur(10px);
  }
  .card::before{
    content:'';position:absolute;inset:0;border-radius:20px;
    background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent);
    opacity:0;transition:opacity 0.25s;
  }
  .card:hover{
    transform:translateY(-4px) scale(1.02);
    border-color:rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.1);
  }
  .card:hover::before{opacity:1;}

  .card.selected{
    transform:translateY(-4px) scale(1.03);
    border-width:2px;
  }
  .card.selected::after{
    content:'✓';
    position:absolute;top:10px;right:12px;
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:white;
  }

  /* Colores por tarjeta */
  .card[data-key="pc"].selected        {background:rgba(99,102,241,0.2);border-color:#6366f1;box-shadow:0 8px 30px rgba(99,102,241,0.3);}
  .card[data-key="pc"].selected::after {background:#6366f1;}
  .card[data-key="wifi"].selected      {background:rgba(14,165,233,0.2);border-color:#0ea5e9;box-shadow:0 8px 30px rgba(14,165,233,0.3);}
  .card[data-key="wifi"].selected::after{background:#0ea5e9;}
  .card[data-key="tv"].selected        {background:rgba(168,85,247,0.2);border-color:#a855f7;box-shadow:0 8px 30px rgba(168,85,247,0.3);}
  .card[data-key="tv"].selected::after {background:#a855f7;}
  .card[data-key="rayo"].selected      {background:rgba(245,158,11,0.2);border-color:#f59e0b;box-shadow:0 8px 30px rgba(245,158,11,0.3);}
  .card[data-key="rayo"].selected::after{background:#f59e0b;}
  .card[data-key="teclado"].selected   {background:rgba(239,68,68,0.2);border-color:#ef4444;box-shadow:0 8px 30px rgba(239,68,68,0.3);}
  .card[data-key="teclado"].selected::after{background:#ef4444;}
  .card[data-key="enchufe"].selected   {background:rgba(16,185,129,0.2);border-color:#10b981;box-shadow:0 8px 30px rgba(16,185,129,0.3);}
  .card[data-key="enchufe"].selected::after{background:#10b981;}

  /* Ícono circular */
  .icon-wrap{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-wrap svg{width:18px;height:18px;}

  .card[data-key="pc"]      .icon-wrap{background:linear-gradient(135deg,#6366f1,#818cf8);box-shadow:0 6px 20px rgba(99,102,241,0.5);}
  .card[data-key="wifi"]    .icon-wrap{background:linear-gradient(135deg,#0ea5e9,#38bdf8);box-shadow:0 6px 20px rgba(14,165,233,0.5);}
  .card[data-key="tv"]      .icon-wrap{background:linear-gradient(135deg,#a855f7,#c084fc);box-shadow:0 6px 20px rgba(168,85,247,0.5);}
  .card[data-key="rayo"]    .icon-wrap{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 20px rgba(245,158,11,0.5);}
  .card[data-key="teclado"] .icon-wrap{background:linear-gradient(135deg,#ef4444,#f87171);box-shadow:0 6px 20px rgba(239,68,68,0.5);}
  .card[data-key="enchufe"] .icon-wrap{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 20px rgba(16,185,129,0.5);}

  .card-label{
    color:#e2e8f0;font-size:10px;font-weight:600;
    text-align:center;line-height:1.3;
  }

  /* Botón otra opción */
  .btn-otra{
    width:100%;padding:9px;border:1.5px dashed rgba(255,255,255,0.2);
    border-radius:12px;background:transparent;
    color:#94a3b8;font-size:12px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all 0.2s;font-family:'Inter',sans-serif;
  }
  .btn-otra:hover{border-color:#6366f1;color:#818cf8;background:rgba(99,102,241,0.08);}
  .btn-otra.activo{border-color:#6366f1;color:#818cf8;background:rgba(99,102,241,0.08);}

  /* Panel descripción */
  .panel-otra{
    display:none;overflow:hidden;
    animation:slideDown 0.25s ease;
  }
  .panel-otra.visible{display:block;}
  @keyframes slideDown{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .panel-otra textarea{
    width:100%;height:80px;padding:10px 12px;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.15);
    border-radius:12px;color:#f1f5f9;
    font-size:12px;font-family:'Inter',sans-serif;
    resize:none;outline:none;transition:border-color 0.2s;
  }
  .panel-otra textarea:focus{border-color:#6366f1;}
  .panel-otra textarea::placeholder{color:#475569;}

  /* Botón enviar */
  .btn-send{
    width:100%;padding:11px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);
    color:white;font-size:13px;font-weight:700;
    cursor:pointer;letter-spacing:0.2px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all 0.2s;
    box-shadow:0 6px 20px rgba(99,102,241,0.4);
    position:relative;overflow:hidden;
  }
  .btn-send::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,#818cf8,#c084fc);
    opacity:0;transition:opacity 0.2s;
  }
  .btn-send:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(99,102,241,0.5);}
  .btn-send:hover::before{opacity:1;}
  .btn-send:active{transform:translateY(0);}
  .btn-send span{position:relative;z-index:1;}
  .btn-send svg{position:relative;z-index:1;width:20px;height:20px;}
  .btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);border-radius:14px;
    padding:14px 22px;color:white;font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:10px;
    transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    z-index:100;white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.success{border-color:rgba(16,185,129,0.4);}
  .toast.error{border-color:rgba(239,68,68,0.4);}
  .toast-icon{font-size:18px;}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<header>
  <div class="header-left">
    <!-- Logo de la empresa en lugar del martillo -->
    <div class="header-logo-container">
      <img id="app-logo" src="" alt="Logo" class="app-logo">
    </div>
    <div>
      <div class="header-title">Soporte Técnico TIC</div>
      <div class="header-sub" id="info-equipo">Cargando información...</div>
    </div>
  </div>
  <div class="header-badge">
    <span class="badge-dot"></span>
    <span id="salon-badge">Salón —</span>
  </div>
</header>

<main>
  <div>
    <div class="section-label">Mesa de ayuda</div>
    <div class="section-title">¿Qué falla tienes <span>hoy?</span></div>
  </div>

  <div class="grid">

    <div class="card" data-key="pc" onclick="seleccionar(this,'Falla de computador')">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <div class="card-label">Falla de<br>computador</div>
    </div>

    <div class="card" data-key="wifi" onclick="seleccionar(this,'Falla de internet')">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="white"/>
        </svg>
      </div>
      <div class="card-label">Falla de<br>internet</div>
    </div>

    <div class="card" data-key="tv" onclick="seleccionar(this,'Falla o encendido de TV')">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/>
        </svg>
      </div>
      <div class="card-label">Falla o encendido<br>de TV</div>
    </div>

    <div class="card" data-key="rayo" onclick="seleccionar(this,'Falla eléctrica')">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="white" stroke="none">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <div class="card-label">Falla<br>eléctrica</div>
    </div>

    <div class="card" data-key="teclado" onclick="seleccionar(this,'Falla de mouse / teclado')">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
        </svg>
      </div>
      <div class="card-label">Falla de<br>mouse / teclado</div>
    </div>

    <div class="card" data-key="enchufe" onclick="seleccionar(this,'Falla de cargador')">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="2" width="10" height="6" rx="1"/>
          <path d="M12 8v4"/>
          <path d="M9 11h6a3 3 0 0 1 0 6H9a3 3 0 0 1 0-6z"/>
          <path d="M12 17v3"/>
        </svg>
      </div>
      <div class="card-label">Falla de<br>cargador</div>
    </div>

  </div>

  <!-- Botón Otra opción -->
  <button class="btn-otra" id="btn-otra" onclick="toggleOtra()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    Otra opción
  </button>

  <!-- Panel descripción -->
  <div class="panel-otra" id="panel-otra">
    <textarea id="txt-otra" placeholder="Describe tu problema aquí..."></textarea>
  </div>

  <button class="btn-send" id="btn-send" onclick="enviar()" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
    <span>Enviar Solicitud al Equipo TIC</span>
  </button>
</main>

<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon"></span>
  <span id="toast-msg"></span>
</div>

<script>
  let categoriaSeleccionada = null;

  function seleccionar(card, categoria) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    categoriaSeleccionada = categoria;
    // Si tenía otra opción activa, la cerramos
    document.getElementById('panel-otra').classList.remove('visible');
    document.getElementById('btn-otra').classList.remove('activo');
    document.getElementById('txt-otra').value = '';
    document.getElementById('btn-send').disabled = false;
  }

  function toggleOtra() {
    const panel = document.getElementById('panel-otra');
    const btn = document.getElementById('btn-otra');
    const visible = panel.classList.toggle('visible');
    btn.classList.toggle('activo', visible);
    if (visible) {
      // Deseleccionar tarjetas
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      categoriaSeleccionada = 'Otra opción';
      document.getElementById('btn-send').disabled = false;
      setTimeout(() => document.getElementById('txt-otra').focus(), 50);
    } else {
      categoriaSeleccionada = null;
      document.getElementById('btn-send').disabled = true;
    }
  }

  function enviar() {
    if (!categoriaSeleccionada) return;
    const descripcion = document.getElementById('txt-otra').value.trim();
    if (categoriaSeleccionada === 'Otra opción' && !descripcion) {
      document.getElementById('txt-otra').style.borderColor = '#ef4444';
      setTimeout(() => document.getElementById('txt-otra').style.borderColor = '', 1500);
      return;
    }
    const payload = categoriaSeleccionada === 'Otra opción'
      ? 'Otra opción: ' + descripcion
      : categoriaSeleccionada;
    if (window.pywebview) {
      window.pywebview.api.enviar_ticket(payload)
        .then(ok => mostrarToast(ok));
    }
  }

  function mostrarToast(exito) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-icon').textContent = exito ? '✅' : '❌';
    document.getElementById('toast-msg').textContent = exito
      ? '¡Solicitud enviada! El equipo TIC te atenderá pronto.'
      : 'No se pudo conectar con el servidor TIC.';
    toast.className = 'toast show ' + (exito ? 'success' : 'error');
    if (exito) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      document.getElementById('panel-otra').classList.remove('visible');
      document.getElementById('btn-otra').classList.remove('activo');
      document.getElementById('txt-otra').value = '';
      categoriaSeleccionada = null;
      document.getElementById('btn-send').disabled = true;
    }
    setTimeout(() => toast.className = 'toast', 3500);
  }

  function setInfo(salon, hostname, ip, logoData) {
    document.getElementById('salon-badge').textContent = 'Salón ' + salon;
    document.getElementById('info-equipo').textContent = hostname + '  •  ' + ip;
    if (logoData) document.getElementById('app-logo').src = logoData;
  }
</script>
</body>
</html>
